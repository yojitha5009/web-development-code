<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

    <h2>AdminHub</h2>
    <p>Employee Management</p>

    <a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="#"><i class="bi bi-people"></i> Employees</a>
    <a href="#"><i class="bi bi-person-plus"></i> Add Employee</a>
    <a href="#"><i class="bi bi-building"></i> Departments</a>
    <a href="#"><i class="bi bi-calendar-check"></i> Attendance</a>
    <a href="#"><i class="bi bi-bar-chart"></i> Reports</a>
    <a href="#"><i class="bi bi-gear"></i> Settings</a>

</div>


    <!-- Main Content -->
    <div class="main-content">

        <!-- Topbar -->
        <div class="topbar">

            <h2>Dashboard</h2>

            <!-- Profile -->
            <div class="profile">
                <i class="bi bi-person-circle"></i>
                <span>Admin</span>
            </div>

        </div>


        <!-- Dashboard Cards -->
        <div class="cards">

            <!-- Card 1 -->
            <div class="card">
                <h3>Total Employees</h3>
                <p>25</p>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <h3>Active Employees</h3>
                <p>20</p>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <h3>On Leave</h3>
                <p>5</p>
            </div>

        </div>


        <!-- Employee Section -->
        <div class="employee-section">

            <h2>Employees</h2>

            <table>

                <!-- Table Heading -->
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Status</th>
                </tr>

                <!-- Employee 1 -->
                <tr>
                    <td>101</td>
                    <td>Rahul</td>
                    <td>IT</td>
                    <td>Active</td>
                </tr>

                <!-- Employee 2 -->
                <tr>
                    <td>102</td>
                    <td>Priya</td>
                    <td>HR</td>
                    <td>Active</td>
                </tr>

                <!-- Employee 3 -->
                <tr>
                    <td>103</td>
                    <td>Anil</td>
                    <td>Finance</td>
                    <td>On Leave</td>
                </tr>

            </table>

        </div>

    </div>

</body>

</html>
