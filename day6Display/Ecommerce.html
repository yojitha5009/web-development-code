<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{

            font-family: Arial, Helvetica, sans-serif;

            background-color: aliceblue;
            height: 100vh;
            
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 100fr));
            gap: 20px;

        }

        .product{

            border: 1px solid black;
            
            height: 320px;
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 10px;

            text-align: center;

            /* box-shadow: xaxis yaxis spread-radius color; */

            box-shadow: 4px 4px 8px black;
        }
        
        .product:hover{

            background-color: bisque;
            color: darkslategray;
            transition: 2s;
            transform: scale(1.04);

        }

        .product img{

            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product button{

            background-color: orange;
            padding: 10px;
            border-radius: 12px;
            width: 90%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="product">
